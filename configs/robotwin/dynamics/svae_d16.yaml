  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: false
  find_unused_parameters: false
  num_epochs: 100000000
  max_train_steps: 100000
  learning_rate: 6.0e-05
  decoder_learning_rate: 0.0003
  train_decoder: false
  use_decoder: false
  training_mode: world_model
  external_decoder_path: null
  dual_decoder:
    enabled: false
  checkpoint_every: null
  checkpoint_every_steps: 10000
  val_every: 1
  viz_every: null
  resume_from: null
wandb:
  enabled: false
  project_name: tokenworld-robotwin-svae-d16-all50-cam-high

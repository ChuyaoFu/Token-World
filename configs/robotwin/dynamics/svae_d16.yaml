# Derived recipe; paper checkpoint mapping is pending.
data:
  dataset_type: robotwin_svae
  data_path: data/cache/robotwin_svae_d16
  latent_method: symmetric_qwen
  tasks: null
  outcomes:
  - success
  - failure
  views:
  - 0
  normalize_latents: true
  latent_stats_scope: per_view
  normalize_action: true
  verify_action_equals_state: true
  num_hist: 4
  num_pred: 16
  random_window_per_episode: true
  random_stride_min: 1
  random_stride_max: 8
  train_sequence_interval: 1
  train_window_stride: 1
  val_sequence_interval: 3
  val_window_stride: 60
  tail_align: true
  lru_episodes: 8
  frameskip: 1
  addskip: 0
  task_prompt: null
model:
  dim: 768
  dim_latent: 16
  num_latent_tokens: 108
  num_spatial_tokens: 108
  spatial_grid_size:
  - 9
  - 12
  num_agent_tokens: 1
  num_video_views: 1
  depth: 12
  time_block_every: 3
  original_discrete_actions:
  - 2
  - 2
  original_continuous_actions: 12
  dim_proprio: 14
  max_steps: 64
  attn_heads: 12
  attn_dim_head: 64
  use_adaln: false
  use_idm: false
  use_reward: false
  prob_no_shortcut_train: 0.75
